<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Holdem Arcade</title>
  <meta name="description" content="친구들과 함께하는 포커 룰 미니게임" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23f5c451' d='M32 4C22 18 8 24 8 38c0 8 6 13 13 13 4 0 7-2 9-4-1 5-3 9-6 13h16c-3-4-5-8-6-13 2 2 5 4 9 4 7 0 13-5 13-13C56 24 42 18 32 4z'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <!-- ===== LOBBY: tap bar on top, walkable plaza below ===== -->
  <main id="lobby" class="screen active">
    <header class="ltop">
      <button id="meBtn" class="ltop-me" data-i18n-label="nav.me">
        <span class="nav-avatar avatar" id="navAvatar"></span>
        <span class="ltop-who"><b id="topName">Player</b><small data-i18n="nav.me">마이페이지</small></span>
      </button>
      <nav class="ltop-btns">
        <button id="setBtn" class="ltop-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 13.5l1.7 1.3-2 3.4-2-.8a7.6 7.6 0 0 1-2.3 1.3l-.3 2.2h-4l-.3-2.2a7.6 7.6 0 0 1-2.3-1.3l-2 .8-2-3.4 1.7-1.3a7.8 7.8 0 0 1 0-3L2.9 9.2l2-3.4 2 .8a7.6 7.6 0 0 1 2.3-1.3L9.5 3h4l.3 2.3a7.6 7.6 0 0 1 2.3 1.3l2-.8 2 3.4-1.7 1.3a7.8 7.8 0 0 1 0 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span data-i18n="top.settings">설정</span></button>
        <button id="topChat" class="ltop-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.6c-.5.4-1.3.1-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z" fill="currentColor"/></svg>
          <span data-i18n="top.chat">채팅</span><em id="topChatBadge" class="chat-badge">0</em></button>
        <button id="rankBtn" class="ltop-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v4a5 5 0 0 1-10 0z" fill="currentColor"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 13h4v3h-4zM8 19h8v2H8z" fill="currentColor"/></svg>
          <span data-i18n="top.rank">랭킹</span></button>
        <button id="roomsBtn" class="ltop-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
          <span data-i18n="top.rooms">방 찾기</span><em id="roomsBadge" class="count-badge"></em></button>
      </nav>
    </header>

    <div id="inviteCard" class="invite-card" hidden>
      <div class="invite-ticket" aria-hidden="true">🎟</div>
      <div class="invite-body">
        <b id="inviteTitle"></b>
        <span id="inviteMeta"></span>
      </div>
      <button id="inviteJoin" class="btn gold" data-i18n="invite.enter">입장하기</button>
    </div>

    <div id="plaza" class="plaza" aria-label="Lobby plaza"></div>
  </main>

  <!-- ===== SETTINGS ===== -->
  <div id="setPanel" class="overlay sheet-overlay" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="sheet">
      <header class="sheet-head">
        <h2 id="setTitle" data-i18n="top.settings">설정</h2>
        <button class="icon-btn" data-close data-i18n-label="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      </header>
      <label class="field">
        <span data-i18n="nick.label">닉네임</span>
        <input id="nameInput" maxlength="12" autocomplete="nickname" placeholder="닉네임을 입력하세요" data-i18n-ph="nick.ph" />
      </label>
      <div class="set-row"><b data-i18n="set.lang">언어</b><button class="lang-toggle btn ghost">EN</button></div>
      <div class="set-row"><b data-i18n="set.sound">효과음</b><button id="lobbyMute" class="btn ghost"></button></div>
      <div class="set-row"><b data-i18n="set.profile">프로필 사진 · 기록</b><button id="setMe" class="btn ghost" data-i18n="nav.me">마이페이지</button></div>
    </div>
  </div>

  <!-- ===== FIND ROOMS ===== -->
  <div id="roomsPanel" class="overlay sheet-overlay" role="dialog" aria-modal="true" aria-labelledby="roomsTitle">
    <div class="sheet">
      <header class="sheet-head">
        <h2 id="roomsTitle" data-i18n="top.rooms">방 찾기</h2>
        <button class="icon-btn" data-close data-i18n-label="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      </header>
      <div class="join">
        <input id="codeInput" maxlength="4" placeholder="방 코드" data-i18n-ph="join.ph" autocomplete="off" spellcheck="false" />
        <button id="joinBtn" class="btn gold" data-i18n="join.btn">참가하기</button>
      </div>
      <h3 class="me-h"><span data-i18n="rooms.title">열린 방</span> <small id="roomsCount"></small></h3>
      <div id="roomList" class="room-list"></div>
      <h3 class="me-h"><span data-i18n="online.title">접속 중</span> <small id="onlineCount"></small></h3>
      <div id="onlineList" class="online-list"></div>
    </div>
  </div>

  <!-- ===== ROOM ===== -->
  <main id="room" class="screen">
    <div class="topbar">
      <button id="leaveBtn" class="icon-btn" data-i18n-label="leave">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="codeChip" class="code-chip" data-i18n-label="invite.copy">ROOM <b id="roomCode">----</b>
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <div class="info-chips">
        <span class="chip-info"><em>ROUND</em><b id="roundInfo">-</b></span>
        <span class="chip-info"><em>ANTE</em><b id="anteInfo">-</b></span>
        <span class="chip-info watch-chip" id="watchInfo" hidden><em>👀</em><b id="watchCount">0</b></span>
      </div>
      <button class="icon-btn" data-tutorial data-i18n-label="howto">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.3 9.4a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.3-2.7 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.2" fill="currentColor"/></svg>
      </button>
      <button id="muteBtn" class="icon-btn" data-i18n-label="sound"></button>
      <button class="lang-toggle lang-chip">EN</button>
    </div>

    <div class="stage">
      <div id="opps" class="opps"></div>

      <div class="table">
        <div class="rail"></div>
        <div class="felt">
          <div class="felt-logo" aria-hidden="true">HOLDEM ARCADE</div>
          <div class="status">
            <div class="timer" id="timer">
              <svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="19"/><circle class="bar" cx="22" cy="22" r="19"/></svg>
              <span id="timerNum"></span>
            </div>
            <div class="status-text">
              <b id="phaseLabel"></b>
              <span id="phaseSub"></span>
            </div>
            <div class="pot"><span class="chip-icon"></span><b id="potInfo">0</b></div>
          </div>
          <div class="board" id="board"></div>
          <div class="grid" id="grid"></div>
          <div class="banner" id="banner"></div>
        </div>
      </div>

      <div id="seatMe" class="seat me"></div>
      <div id="actionBar" class="action-bar"></div>
    </div>

    <!-- Indian Poker has its own table (built by app.js) -->
    <div id="ipTable" class="ip-table"></div>
    <div id="bombTable" class="ip-table bomb-table"></div>

    <div id="spotlight" class="spotlight" role="status" aria-live="polite"></div>
    <div id="overlay" class="overlay"></div>
    <div id="netState" class="net-state" data-i18n="net.reconnecting">서버에 다시 연결하는 중…</div>

  </main>

  <!-- chat -->
  <button id="chatFab" class="chat-fab" data-i18n-label="chat.open">
    <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.6c-.5.4-1.3.1-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z" fill="currentColor"/><circle cx="8.5" cy="9.5" r="1.3" fill="#0b1a48"/><circle cx="12" cy="9.5" r="1.3" fill="#0b1a48"/><circle cx="15.5" cy="9.5" r="1.3" fill="#0b1a48"/></svg>
    <span id="chatBadge" class="chat-badge">0</span>
  </button>
  <aside id="chatPanel" class="chat-panel" aria-label="채팅">
    <header class="chat-head">
      <b id="chatTitle" data-i18n="chat.title">채팅</b>
      <button id="chatClose" class="icon-btn" data-i18n-label="chat.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </header>
    <div id="chatList" class="chat-list"></div>
    <div id="stickerTray" class="sticker-tray"></div>
    <form id="chatForm" class="chat-input" autocomplete="off">
      <button type="button" id="stickerBtn" class="sticker-btn" data-i18n-label="chat.stickers">
        <svg viewBox="0 0 24 24"><path d="M5 9.5Q4 4 9 6.3a8 8 0 0 1 6 0Q20 4 19 9.5a8 7 0 1 1-14 0z" fill="#fff" stroke="#4a3b3b" stroke-width="1.4" stroke-linejoin="round"/><circle cx="9.3" cy="12" r="1" fill="#4a3b3b"/><circle cx="14.7" cy="12" r="1" fill="#4a3b3b"/><ellipse cx="7.4" cy="14" rx="1.3" ry=".8" fill="#ffb3c1"/><ellipse cx="16.6" cy="14" rx="1.3" ry=".8" fill="#ffb3c1"/><path d="M10.8 14q.6.8 1.2 0 .6.8 1.2 0" fill="none" stroke="#4a3b3b" stroke-width="1" stroke-linecap="round"/></svg>
      </button>
      <input id="chatInput" maxlength="120" placeholder="메시지 입력" data-i18n-ph="chat.ph" enterkeyhint="send" />
      <button type="submit" class="send" data-i18n-label="chat.send"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z" fill="currentColor"/></svg></button>
    </form>
  </aside>

  <!-- ===== CREATE-ROOM SETTINGS ===== -->
  <div id="setup" class="overlay" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <div class="result-card setup-card">
      <h2 id="setupTitle" data-i18n="setup.title">방 설정</h2>
      <p class="reason"><span id="setupGameName">기억 포커</span> · <button class="tut-inline" id="setupTutorial" data-tutorial="memory" data-i18n="howto">게임 방법</button></p>
      <div class="setting">
        <div class="setting-head"><b data-i18n="setup.players">인원</b></div>
        <div class="seg seg-5" data-key="players">
          <button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button>
        </div>
      </div>
      <div class="setting" data-only="memory">
        <div class="setting-head"><b data-i18n="setup.memorize">기억 시간</b><span><em id="memVal">30</em><span data-i18n="sec">초</span></span></div>
        <div class="seg" data-key="memorizeSec">
          <button data-v="10">10</button><button data-v="15">15</button><button data-v="20">20</button>
          <button data-v="30">30</button><button data-v="45">45</button><button data-v="60">60</button>
        </div>
        <input type="range" min="5" max="90" step="1" data-key="memorizeSec" data-i18n-label="setup.memorize" />
      </div>
      <div class="setting" data-only="memory nut">
        <div class="setting-head"><b data-i18n="setup.betting">베팅 라운드</b><span data-i18n="setup.bettingHint">카드를 고른 뒤 자신감으로 베팅</span></div>
        <div class="seg seg-2" data-key="betting">
          <button data-v="on" data-i18n="bet.onLabel">켜기</button><button data-v="off" data-i18n="bet.offLabel">끄기</button>
        </div>
      </div>
      <div class="setting" data-only="memory nut indian">
        <div class="setting-head"><b data-i18n="setup.turn">한 턴 시간</b><span><em id="turnVal">20</em><span data-i18n="sec">초</span></span></div>
        <div class="seg" data-key="turnSec">
          <button data-v="10">10</button><button data-v="15">15</button><button data-v="20">20</button>
          <button data-v="30">30</button><button data-v="45">45</button><button data-v="60">60</button>
        </div>
      </div>
      <div class="setting" data-only="memory nut">
        <div class="setting-head"><b data-i18n="setup.pick">선택 시간</b><span><em id="pickVal">20</em><span data-i18n="sec">초</span></span></div>
        <div class="seg" data-key="pickSec">
          <button data-v="10">10</button><button data-v="15">15</button><button data-v="20">20</button>
          <button data-v="30">30</button><button data-v="45">45</button><button data-v="60">60</button>
        </div>
        <input type="range" min="5" max="60" step="1" data-key="pickSec" data-i18n-label="setup.pick" />
      </div>
      <div class="setting" data-only="bomb">
        <div class="setting-head"><b data-i18n="setup.lives">목숨</b><span data-i18n="setup.livesHint">다 잃으면 탈락</span></div>
        <div class="seg seg-4" data-key="lives">
          <button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="5">5</button>
        </div>
      </div>
      <div class="result-actions">
        <button class="btn ghost" id="setupCancel" data-i18n="cancel">취소</button>
        <button class="btn gold big" id="setupCreate" data-i18n="cta.create">방 만들기</button>
      </div>
    </div>
  </div>

  <!-- ===== RANKING ===== -->
  <div id="rankPanel" class="overlay sheet-overlay" role="dialog" aria-modal="true" aria-labelledby="rankTitle">
    <div class="sheet">
      <header class="sheet-head">
        <h2 id="rankTitle"><span aria-hidden="true">🏆</span> <span data-i18n="rank.title">랭킹</span></h2>
        <button class="icon-btn" data-close data-i18n-label="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      </header>
      <div class="tabs" id="rankTabs">
        <button data-g="memory" data-i18n="game.memory">기억 포커</button>
        <button data-g="nut" data-i18n="game.nut">너트 레이스</button>
        <button data-g="indian" data-i18n="game.indian">인디언 포커</button>
        <button data-g="bomb" data-i18n="game.bomb">고양이 폭탄 파티</button>
      </div>
      <div class="rank-list" id="rankList"></div>
      <div class="rank-me" id="rankMe"></div>
      <p class="sheet-note" data-i18n="rank.note"></p>
    </div>
  </div>

  <!-- ===== MY PAGE ===== -->
  <div id="mePanel" class="overlay sheet-overlay" role="dialog" aria-modal="true" aria-labelledby="meTitle">
    <div class="sheet">
      <header class="sheet-head">
        <h2 id="meTitle" data-i18n="me.title">마이페이지</h2>
        <button class="icon-btn" data-close data-i18n-label="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      </header>
      <section class="me-profile">
        <div class="me-avatar avatar" id="meAvatar"></div>
        <div class="me-fields">
          <label class="field"><span data-i18n="me.name">닉네임</span>
            <div class="me-name-row"><input id="meName" maxlength="12" /><button class="btn gold" id="meSave" data-i18n="me.save">저장</button></div>
          </label>
        </div>
      </section>
      <section>
        <h3 class="me-h" data-i18n="me.photo">프로필 사진</h3>
        <div class="avatar-grid" id="avatarGrid"></div>
        <label class="btn ghost upload-btn"><span aria-hidden="true">📷</span> <span data-i18n="me.upload">사진 올리기</span>
          <input type="file" id="avatarFile" accept="image/*" hidden /></label>
      </section>
      <section>
        <h3 class="me-h" data-i18n="me.stats">게임별 기록</h3>
        <div class="stat-cards" id="statCards"></div>
      </section>
      <section class="transfer">
        <h3 class="me-h" data-i18n="me.transfer">계정 이전 코드</h3>
        <p class="sheet-note" data-i18n="me.transferHint"></p>
        <div class="code-row"><input id="myCode" readonly value="••••••••••••" /><button class="btn ghost" id="showCode" data-i18n="me.show">보기</button><button class="btn ghost" id="copyCode" data-i18n="me.copy">복사</button></div>
        <div class="code-row"><input id="importCode" data-i18n-ph="me.import" placeholder="코드로 불러오기" /><button class="btn gold" id="importBtn" data-i18n="me.importBtn">불러오기</button></div>
      </section>
    </div>
  </div>

  <!-- ===== TUTORIAL ===== -->
  <div id="tutorial" class="overlay" role="dialog" aria-modal="true" aria-labelledby="tutTitle">
    <div class="result-card tut-card">
      <button class="tut-close icon-btn" id="tutClose" data-i18n-label="close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <div class="tut-step" id="tutStep"></div>
      <h2 id="tutTitle"></h2>
      <div class="tut-stage" id="tutStage"></div>
      <p class="tut-text" id="tutText"></p>
      <div class="tut-dots" id="tutDots"></div>
      <div class="result-actions">
        <button class="btn ghost" id="tutPrev" data-i18n="prev">이전</button>
        <button class="btn gold big" id="tutNext">다음</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="i18n.js"></script>
  <script src="sfx.js"></script>
  <script src="bg.js"></script>
  <script src="stickers.js"></script>
  <script src="app.js"></script>
  <script src="chat.js"></script>
  <script src="tutorial.js"></script>
  <script src="profile.js"></script>
  <script src="plaza.js"></script>
  <script src="taunts.js"></script>
  <script src="roam.js"></script>
  <script src="duel.js"></script>
</body>
</html>
